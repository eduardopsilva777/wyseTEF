# SOMENTE DESENVOLVIMENTO E TESTES LOCAIS. Não usar como base de produção.
# Credenciais vêm do arquivo .env (ignorado pelo Git); veja .env.example.
name: tef-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      # Exposto apenas na interface local.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - tef-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  tef-pg-data:
